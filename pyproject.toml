[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vigil-aem"
version = "0.1.0"
description = "Research foundation for risk-aware procedural transfer in LLM agents"
readme = "README.md"
requires-python = "==3.11.*"
license = "MIT"
dependencies = [
    "matplotlib==3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.4.6",
    "openai>=3.24.0",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow==25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.3",
    "statsmodels>=0.15.0",
    "tenacity>=9.1.4",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "xgboost>=3.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "experiments", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["numpy.*", "torch.*", "mlflow.*", "sentence_transformers.*", "sklearn.*", "pandas.*", "scipy.*", "matplotlib.*", "xgboost.*", "joblib.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: local integration tests without external credentials"]

[tool.coverage.run]
source = ["vigil"]
branch = true

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
